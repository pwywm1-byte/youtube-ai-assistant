version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: youtube-ai-postgres
    environment:
      POSTGRES_USER: youtube_ai
      POSTGRES_PASSWORD: youtube_ai_password
      POSTGRES_DB: youtube_ai_assistant
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: youtube-ai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: youtube-ai-api
    environment:
      DATABASE_URL: postgresql://youtube_ai:youtube_ai_password@postgres:5432/youtube_ai_assistant
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app
      - ./logs:/app/logs

volumes:
  postgres_data:
  redis_data:

[project]
name = "youtube-ai-assistant"
version = "1.0.0"
description = "Autonomous AI-powered YouTube content assistant"
authors = [
    {name = "AI Team", email = "support@example.com"}
]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.urls]
Homepage = "https://github.com/pwywm1-byte/youtube-ai-assistant"
Repository = "https://github.com/pwywm1-byte/youtube-ai-assistant"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = "test_*.py"
